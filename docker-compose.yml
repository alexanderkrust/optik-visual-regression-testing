# optik — production setup: one optik container plus PostgreSQL.
#
#   docker compose up -d
#   open http://localhost:3000 and create the admin account
#
# Screenshots are stored in the optik-data volume. To use S3-compatible object
# storage instead, set S3_BUCKET, S3_ENDPOINT, S3_ACCESS_KEY_ID and
# S3_SECRET_ACCESS_KEY on the optik service.

services:
  optik:
    image: ${OPTIK_IMAGE:-optik:latest}
    build: .
    ports:
      - '${OPTIK_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://optik:${POSTGRES_PASSWORD:-optik}@postgres:5432/optik
    volumes:
      - optik-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: optik
      POSTGRES_USER: optik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optik}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U optik -d optik']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  optik-data:
  postgres-data:
