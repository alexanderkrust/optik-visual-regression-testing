name: Release

# optik has one product version (all @optik/* packages, see .changeset/).
#  1. Changesets keeps a "Version Packages" pull request up to date.
#  2. Merging it bumps the version on main. This workflow then publishes the
#     release: signed multi-arch image with SBOM, Helm chart, air-gapped
#     installation bundles, git tag and GitHub release. Versions that already
#     have a tag are skipped. New optik-renderer versions are published too.
#  3. LTS lines live on release/x.y branches (see docs/releases.md): the same
#     flow publishes their patch releases, without moving the "latest" tags.

on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The Cypress adapter only needs Cypress's types — skip its ~500 MB app
  CYPRESS_INSTALL_BINARY: '0'

permissions:
  contents: write       # tag and GitHub release
  pull-requests: write  # "Version Packages" pull request
  packages: write       # push image and chart to GHCR
  id-token: write       # keyless cosign signing via GitHub OIDC
  attestations: write

jobs:
  version-pr:
    name: Version pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v2
        with:
          version: pnpm version-packages
          # One pull request per branch: main and each LTS line
          title: ${{ github.ref_name == 'main' && 'Version Packages' || format('Version Packages ({0})', github.ref_name) }}
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Release needed?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(node -p "require('./apps/api/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "0.0.0" ]; then
            echo "Version 0.0.0 is never released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          # A patch of an older LTS line must not become "latest"
          newest=$(printf '%s\n' $(git tag -l 'v*' | sed 's/^v//') "$version" | sort -V | tail -1)
          if [ "$newest" = "$version" ]; then latest=true; else latest=false; fi
          echo "Latest release: $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  renderer:
    name: Renderer images
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: imjasonh/setup-crane@v0.7
      # One image per Playwright version in versions.txt, amd64 only (see
      # docker/renderer/Dockerfile). Published tags are never rebuilt: the same
      # tag has to produce the same pixels for as long as anyone uses it.
      - name: Build, push and sign new renderer versions
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/optik-renderer"
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          for version in $(grep -v '^#' docker/renderer/versions.txt); do
            if crane manifest "$image:$version" >/dev/null 2>&1; then
              echo "$image:$version exists — kept as it is"
              continue
            fi
            docker buildx build docker/renderer \
              --platform linux/amd64 \
              --build-arg "PLAYWRIGHT_VERSION=$version" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --tag "$image:$version" \
              --sbom=true --provenance=mode=max \
              --metadata-file meta.json --push
            digest=$(jq -r '."containerimage.digest"' meta.json)
            cosign sign --yes "$image@$digest"
            echo "Published $image:$version ($digest)"
          done

  release:
    name: Publish v${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      LATEST: ${{ needs.check.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
      - name: Image and chart names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "IMAGE=ghcr.io/$owner/optik"
            echo "CHART_REPO=ghcr.io/$owner/charts"
            echo "MINOR=${VERSION%.*}"
            # Licenses unlock releases built within their update period
            echo "RELEASE_DATE=$(date -u +%F)"
          } >> "$GITHUB_ENV"

      # ── Image ──────────────────────────────────────────────────────────────
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OPTIK_VERSION=${{ env.VERSION }}
            OPTIK_RELEASE_DATE=${{ env.RELEASE_DATE }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.MINOR }}
            ${{ env.LATEST == 'true' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.title=optik
            org.opencontainers.image.description=Self-hosted visual regression testing
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # SBOM and SLSA provenance as BuildKit attestations in the registry
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── SBOM and signatures ────────────────────────────────────────────────
      - name: SBOM (SPDX) for the release assets
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: optik-${{ env.VERSION }}.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@v3
      - name: Sign image and attest SBOM
        run: |
          ref="$IMAGE@${{ steps.image.outputs.digest }}"
          cosign sign --yes "$ref"
          cosign attest --yes --type spdxjson --predicate "optik-$VERSION.spdx.json" "$ref"

      # ── Helm chart ─────────────────────────────────────────────────────────
      - uses: azure/setup-helm@v5
      - name: Package, push and sign Helm chart
        run: |
          helm package charts/optik --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          digest=$(helm push "optik-$VERSION.tgz" "oci://$CHART_REPO" 2>&1 | tee /dev/stderr | awk '/^Digest:/ {print $2}')
          cosign sign --yes "$CHART_REPO/optik@$digest"

      # ── Air-gapped bundles ─────────────────────────────────────────────────
      - uses: imjasonh/setup-crane@v0.7
      - name: Build and sign air-gapped bundles
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p bundles
          for arch in amd64 arm64; do
            bundle=$(scripts/airgap-bundle.sh "$VERSION" "$arch" \
              "$IMAGE@${{ steps.image.outputs.digest }}" "optik-$VERSION.tgz" bundles)
            cosign sign-blob --yes --bundle "$bundle.sigstore.json" "$bundle"
          done
          ls -lh bundles

      # ── Tag and GitHub release (last, so a failed run can simply be retried) ─
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > notes.md
          cat >> notes.md <<NOTES

          ## Install

          \`\`\`bash
          docker pull $IMAGE:$VERSION
          helm install optik oci://$CHART_REPO/optik --version $VERSION
          \`\`\`

          Without internet access: download \`optik-$VERSION-airgap-<arch>.tar.gz\` below and follow the \`INSTALL.md\` inside.

          Image digest: \`${{ steps.image.outputs.digest }}\` — signed with cosign (keyless), SBOM attached. See [Verifying releases](https://alexanderkrust.github.io/optik-visual-regression-testing/security/verifying-releases) and [upgrading](https://alexanderkrust.github.io/optik-visual-regression-testing/upgrading).
          NOTES
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --latest="$LATEST" \
            --title "optik $VERSION" \
            --notes-file notes.md \
            "optik-$VERSION.spdx.json" "optik-$VERSION.tgz" bundles/*
