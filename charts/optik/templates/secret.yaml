{{- if or .Values.postgresql.enabled (not .Values.database.existingSecret) }}
{{- if and (not .Values.postgresql.enabled) (not .Values.database.url) }}
{{- fail "Set database.url or database.existingSecret, or enable the bundled postgresql" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "optik.fullname" . }}
  labels:
    {{- include "optik.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgresql://optik:%s@%s:5432/optik" (include "optik.postgresql.password" . | urlquery) (include "optik.postgresql.fullname" .) | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
{{- end }}
---
{{- if and .Values.storage.s3.enabled (not .Values.storage.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "optik.s3.secretName" . }}
  labels:
    {{- include "optik.labels" . | nindent 4 }}
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: {{ required "storage.s3.accessKeyId or storage.s3.existingSecret is required" .Values.storage.s3.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "storage.s3.secretAccessKey or storage.s3.existingSecret is required" .Values.storage.s3.secretAccessKey | quote }}
{{- end }}
