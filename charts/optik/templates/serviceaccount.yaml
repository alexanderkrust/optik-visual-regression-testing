{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "optik.serviceAccountName" . }}
  labels:
    {{- include "optik.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# optik doesn't talk to the Kubernetes API
automountServiceAccountToken: false
{{- end }}
